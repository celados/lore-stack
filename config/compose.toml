# Runtime secrets are injected through LORE__ and AWS environment variables.
[immutable_store]
mode = "pg"

[mutable_store]
mode = "pg"

[lock_store]
mode = "pg"

[plugins.pg]
s3_bucket = "lore-fragments"
s3_endpoint_url = "http://silo:9000"
s3_region = "us-east-1"
s3_force_path_style = true
fragments_table = "fragments"
metadata_table = "fragments_meta"
mutable_table = "mutable_store"
locks_table = "locks"

[server.http]
store_health_check = true

[telemetry.logger]
format = "json"
output = "stdout"
