# Paths are project-root-relative: this project is mirrored to its own GitHub repo.
# The custom server overlays lore-pg onto a pinned upstream Lore checkout.
name: build-loreserver

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-loreserver-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Linux binaries are compiled in per-platform Docker containers on the Mac
    # mini. This keeps the expensive Rust work off GitHub-hosted runners.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # target/ and Cargo's registry are the persistent cache. The default
          # git clean would erase both before every build.
          clean: false

      - name: Prepare persistent workspace
        run: |
          rm -rf dist
          mkdir -p .build/cargo

          limit_gb=40
          size_gb="$(du -sg .build 2>/dev/null | cut -f1 || echo 0)"
          echo ".build is ${size_gb:-0} GB (limit ${limit_gb} GB)"
          if [ "${size_gb:-0}" -gt "$limit_gb" ]; then
            echo "clearing .build for a bounded cold rebuild"
            rm -rf .build
            mkdir -p .build/cargo
          fi

      - name: Build Linux release binaries
        run: |
          for spec in \
            "arm64:aarch64-unknown-linux-gnu" \
            "amd64:x86_64-unknown-linux-gnu"
          do
            arch="${spec%%:*}"
            target="${spec#*:}"
            image="celados-lore-stack-builder:$arch"

            docker build \
              --platform "linux/$arch" \
              --file docker/build.Dockerfile \
              --tag "$image" \
              docker

            docker run --rm \
              --platform "linux/$arch" \
              --env BUILD_DIR="/work/.build/$arch" \
              --env CARGO_BUILD_JOBS \
              --env CARGO_HOME="/work/.build/cargo" \
              --env TARGET="$target" \
              --volume "$GITHUB_WORKSPACE:/work" \
              --workdir /work \
              "$image" \
              bash scripts/build.sh

            cp dist/loreserver "dist/loreserver-$arch"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: loreserver-linux
          path: |
            dist/loreserver-amd64
            dist/loreserver-arm64
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: loreserver-linux
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/loreserver-amd64
            dist/loreserver-arm64

  docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Docker Hub configured?
        id: gate
        run: echo "on=${{ secrets.DOCKERHUB_USERNAME != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.on == 'true'
      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.on == 'true'
        with:
          name: loreserver-linux
          path: dist
      - uses: docker/setup-buildx-action@v4
        if: steps.gate.outputs.on == 'true'
      - uses: docker/login-action@v4
        if: steps.gate.outputs.on == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.gate.outputs.on == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/loreserver:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/loreserver:${{ github.ref_name }}
